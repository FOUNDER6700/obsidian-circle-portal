<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Member Directory | The Obsidian Circle</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .directory-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #121215;
            padding: 30px 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .header-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            letter-spacing: 3px;
            color: #a0a0b0;
        }
        .member-card {
            background-color: #070709;
            border: 1px solid #444;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .member-codename {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .member-details {
            font-size: 12px;
            color: #888;
            letter-spacing: 1px;
        }
        .status-active {
            color: #4CAF50; /* Subtle Green */
        }
        .back-btn {
            background-color: #333;
            color: #fff;
            margin-top: 20px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="directory-container" id="directory-box" style="display: none;">
        <div class="header-title">◎ MEMBER DIRECTORY</div>
        
        <!-- This is where the members will appear -->
        <div id="members-list">
            <div style="text-align: center; color: #888; font-size: 12px;">ENCRYPTING AND FETCHING DATA...</div>
        </div>

        <button class="back-btn" onclick="window.location.href='dashboard.html'">RETURN TO DASHBOARD</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://ahridkmlgjsmlqkqatrz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFocmlka21sZ2pzbWxxa3FhdHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjYwODUsImV4cCI6MjEwNTY0MjA4NX0.r_vPhWLs-hKg7xk6lyge8ITkPP30y53442jrGqNwhWQ';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener("DOMContentLoaded", async () => {
            
            // 1. Security Check: Are they logged in?
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.replace("index.html");
                return;
            }

            // 2. Show the directory container
            document.getElementById("directory-box").style.display = "block";

            // 3. Fetch all profiles securely from the database
            const { data: profiles, error } = await supabaseClient
                .from('profiles')
                .select('member_id, codename, rank, status')
                .order('created_at', { ascending: true });

            if (error) {
                document.getElementById("members-list").innerHTML = `<div style="color:red; text-align:center;">Error loading directory.</div>`;
                return;
            }

            // 4. Build the visual list of members
            const listContainer = document.getElementById("members-list");
            listContainer.innerHTML = ""; // Clear the loading text

            profiles.forEach(profile => {
                // Design each member's card
                const card = document.createElement("div");
                card.className = "member-card";
                
                card.innerHTML = `
                    <div class="member-codename">${profile.codename}</div>
                    <div class="member-details">ID: ${profile.member_id}</div>
                    <div class="member-details">RANK: ${profile.rank}</div>
                    <div class="member-details">STATUS: <span class="status-active">${profile.status}</span></div>
                `;
                
                listContainer.appendChild(card);
            });
        });
    </script>
</body>
      </html>
