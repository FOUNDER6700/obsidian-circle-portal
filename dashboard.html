<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard | The Obsidian Circle</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background-color: #000; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .dashboard-container { width: 100%; max-width: 480px; background-color: #0c0c0e; border: 1px solid #222; border-radius: 8px; padding: 28px 20px; box-shadow: 0 0 25px rgba(0, 0, 0, 0.9); }
        .header-title { text-align: center; font-size: 17px; letter-spacing: 3px; color: #e0e0e0; font-weight: bold; margin-bottom: 20px; }
        
        .profile-card { background-color: #121216; border: 1px solid #26262b; border-radius: 6px; padding: 16px; margin-bottom: 24px; }
        .profile-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
        .profile-row:last-child { margin-bottom: 0; }
        .label { color: #777; letter-spacing: 1px; }
        .val-codename { color: #fff; font-weight: bold; letter-spacing: 1px; }
        .badge-rank { padding: 3px 8px; border-radius: 3px; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; border: 1px solid #444; background: #000; }
        
        .menu-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .menu-btn { background-color: #121216; color: #dedede; border: 1px solid #2b2b32; padding: 14px; border-radius: 5px; text-align: center; font-size: 13px; font-weight: bold; letter-spacing: 2px; cursor: pointer; transition: border-color 0.2s, background-color 0.2s, color 0.2s; }
        .menu-btn:hover { border-color: #666; background-color: #18181f; color: #fff; }
        
        /* Specialized Rank Buttons */
        .member-chat-btn { border-color: #888 !important; color: #ccc !important; }
        .specialist-chat-btn { border-color: #00e5ff !important; color: #00e5ff !important; background-color: rgba(0, 229, 255, 0.05); }
        .council-chat-btn { border-color: #c77dff !important; color: #c77dff !important; background-color: rgba(157, 78, 221, 0.05); }
        .admin-btn { border-color: #ff4d4d !important; color: #ff4d4d !important; background-color: rgba(255, 77, 77, 0.05); }
        
        .logout-btn { width: 100%; background-color: transparent; color: #666; border: 1px solid #222; padding: 12px; border-radius: 5px; font-size: 12px; letter-spacing: 2px; cursor: pointer; }
        .logout-btn:hover { color: #ff4d4d; border-color: #442222; }
    </style>
</head>
<body>

    <div class="dashboard-container" id="dashboard-box" style="display: none;">
        <div class="header-title">THE OBSIDIAN CIRCLE</div>

        <div class="profile-card">
            <div class="profile-row">
                <span class="label">CODENAME</span>
                <span class="val-codename" id="user-codename">AUTHENTICATING...</span>
            </div>
            <div class="profile-row">
                <span class="label">CLEARANCE</span>
                <span class="badge-rank" id="user-rank">VERIFYING</span>
            </div>
        </div>

        <div class="menu-grid">
            <!-- Universal Access -->
            <div class="menu-btn" onclick="window.location.href='projects.html'">ACTIVE PROJECTS</div>
            <div class="menu-btn" onclick="window.location.href='teams.html'">TEAMS / DIRECTORY</div>
            <div class="menu-btn" onclick="window.location.href='announcements.html'">ANNOUNCEMENTS</div>
            
            <!-- Rank Specific Chats -->
            <div class="menu-btn member-chat-btn" onclick="window.location.href='chat_member.html'">[ GLOBAL MEMBER CHAT ]</div>
            <div class="menu-btn specialist-chat-btn" id="btn-chat-specialist" onclick="window.location.href='chat_specialist.html'" style="display: none;">[ SPECIALIST COMM-LINK ]</div>
            <div class="menu-btn council-chat-btn" id="btn-chat-council" onclick="window.location.href='chat_council.html'" style="display: none;">[ COUNCIL COMM-LINK ]</div>
            
            <!-- Admin / Meeting -->
            <div class="menu-btn council-chat-btn" id="btn-meeting" onclick="window.location.href='meeting.html'" style="display: none;">COUNCIL CHAMBERS</div>
            <div class="menu-btn admin-btn" id="btn-admin" onclick="window.location.href='admin.html'" style="display: none;">[ ADMIN PANEL ]</div>
        </div>

        <button class="logout-btn" id="btn-logout">DISCONNECT SESSION</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://ahridkmlgjsmlqkqatrz.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFocmlka21sZ2pzbWxxa3FhdHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjYwODUsImV4cCI6MjEwNTY0MjA4NX0.r_vPhWLs-hKg7xk6lyge8ITkPP30y53442jrGqNwhWQ'; 
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    document.addEventListener("DOMContentLoaded", async () => {
        // 1. Verify Login
        const { data: { user }, error } = await supabaseClient.auth.getUser();

        if (error || !user) {
            window.location.replace("index.html");
            return;
        }

        // 2. Extract Data from Email
        const codename = user.email.split('@')[0].toUpperCase(); // Turns "founder-01" into "FOUNDER-01"
        const rank = codename.split('-')[0]; // Turns "FOUNDER-01" into "FOUNDER"

        // 3. Update the Profile Card text
        const codenameEl = document.getElementById("user-codename");
        if (codenameEl) codenameEl.textContent = codename;

        const rankEl = document.getElementById("user-rank");
        if (rankEl) {
            rankEl.textContent = rank;
            
            // Set clearance badge colors
            if (rank === 'FOUNDER') {
                rankEl.style.color = '#ff4d4d'; rankEl.style.borderColor = '#ff4d4d';
            } else if (rank === 'COUNCIL') {
                rankEl.style.color = '#c77dff'; rankEl.style.borderColor = '#c77dff';
            } else if (rank === 'SPECIALIST') {
                rankEl.style.color = '#00e5ff'; rankEl.style.borderColor = '#00e5ff';
            } else {
                rankEl.style.color = '#888'; rankEl.style.borderColor = '#444';
            }
        }

        // 4. Reveal buttons based on clearance
        const showElement = (id) => {
            const el = document.getElementById(id);
            if (el) el.style.display = "block";
        };

        if (rank === 'FOUNDER' || rank === 'COUNCIL') {
            showElement("btn-admin");
            showElement("btn-meeting");
            showElement("btn-chat-council");
            showElement("btn-chat-specialist");
        } else if (rank === 'SPECIALIST') {
            showElement("btn-chat-specialist");
        }

        // 5. Reveal the dashboard
        showElement("dashboard-box");

        // 6. Secure Logout
        const logoutBtn = document.getElementById("btn-logout");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", async () => {
                await supabaseClient.auth.signOut();
                window.location.replace("index.html");
            });
        }
    });
                    </script>
</body>
</html>
