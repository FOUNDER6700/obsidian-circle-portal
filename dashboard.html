<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard | The Obsidian Circle</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background-color: #000; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .dashboard-container { width: 100%; max-width: 480px; background-color: #0c0c0e; border: 1px solid #222; border-radius: 8px; padding: 28px 20px; box-shadow: 0 0 25px rgba(0, 0, 0, 0.9); }
        .header-title { text-align: center; font-size: 17px; letter-spacing: 3px; color: #e0e0e0; font-weight: bold; margin-bottom: 20px; }
        
        .profile-card { background-color: #121216; border: 1px solid #26262b; border-radius: 6px; padding: 16px; margin-bottom: 15px; }
        .profile-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
        .profile-row:last-child { margin-bottom: 0; }
        .label { color: #777; letter-spacing: 1px; }
        .val-codename { color: #fff; font-weight: bold; letter-spacing: 1px; }
        .badge-rank { padding: 3px 8px; border-radius: 3px; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; border: 1px solid #444; background: #000; }
        
        /* New Clearance Chart Styles */
        .chart-card { background-color: #121216; border: 1px solid #26262b; border-radius: 6px; padding: 16px; margin-bottom: 24px; }
        .chart-title { text-align: center; font-size: 11px; color: #777; letter-spacing: 2px; margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 8px; }
        .chart-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .chart-row:last-child { margin-bottom: 0; }
        .chart-desc { font-size: 11px; color: #999; }
        .rank-label { padding: 3px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; letter-spacing: 1px; border: 1px solid; background: #000; }
        .r-founder { color: #ff4d4d; border-color: #ff4d4d; }
        .r-council { color: #c77dff; border-color: #c77dff; }
        .r-specialist { color: #00e5ff; border-color: #00e5ff; }
        .r-member { color: #888; border-color: #444; }

        .menu-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .menu-btn { background-color: #121216; color: #dedede; border: 1px solid #2b2b32; padding: 14px; border-radius: 5px; text-align: center; font-size: 13px; font-weight: bold; letter-spacing: 2px; cursor: pointer; transition: border-color 0.2s, background-color 0.2s, color 0.2s; }
        .menu-btn:hover { border-color: #666; background-color: #18181f; color: #fff; }
        .admin-btn { border-color: #ff4d4d !important; color: #ff4d4d !important; background-color: rgba(255, 77, 77, 0.05); }
        .admin-btn:hover { background-color: rgba(255, 77, 77, 0.15) !important; }
        .council-btn { border-color: #9d4edd !important; color: #c77dff !important; background-color: rgba(157, 78, 221, 0.05); }
        .council-btn:hover { background-color: rgba(157, 78, 221, 0.15) !important; }
        
        .logout-btn { width: 100%; background-color: transparent; color: #666; border: 1px solid #222; padding: 12px; border-radius: 5px; font-size: 12px; letter-spacing: 2px; cursor: pointer; }
        .logout-btn:hover { color: #ff4d4d; border-color: #442222; }
    </style>
</head>
<body>

    <div class="dashboard-container" id="dashboard-box" style="display: none;">
        <div class="header-title">THE OBSIDIAN CIRCLE</div>

        <div class="profile-card">
            <div class="profile-row">
                <span class="label">CODENAME</span>
                <span class="val-codename" id="user-codename">AUTHENTICATING...</span>
            </div>
            <div class="profile-row">
                <span class="label">CLEARANCE</span>
                <span class="badge-rank" id="user-rank">VERIFYING</span>
            </div>
        </div>

        <!-- Clearance Hierarchy Chart -->
        <div class="chart-card">
            <div class="chart-title">CLEARANCE HIERARCHY</div>
            <div class="chart-row">
                <span class="rank-label r-founder">FOUNDER</span>
                <span class="chart-desc">Master Admin & Host</span>
            </div>
            <div class="chart-row">
                <span class="rank-label r-council">COUNCIL</span>
                <span class="chart-desc">Meeting & Broadcast Access</span>
            </div>
            <div class="chart-row">
                <span class="rank-label r-specialist">SPECIALIST</span>
                <span class="chart-desc">Team Creation & Comms</span>
            </div>
            <div class="chart-row">
                <span class="rank-label r-member">MEMBER</span>
                <span class="chart-desc">Standard Access</span>
            </div>
        </div>

        <div class="menu-grid">
            <div class="menu-btn" onclick="window.location.href='projects.html'">ACTIVE PROJECTS</div>
            <div class="menu-btn" onclick="window.location.href='teams.html'">TEAMS / DIRECTORY</div>
            <div class="menu-btn" onclick="window.location.href='announcements.html'">ANNOUNCEMENTS</div>
            <div class="menu-btn council-btn" id="btn-meeting" onclick="window.location.href='meeting.html'" style="display: none;">COUNCIL CHAMBERS</div>
            <div class="menu-btn admin-btn" id="btn-admin" onclick="window.location.href='admin.html'" style="display: none;">[ ADMIN PANEL ]</div>
        </div>

        <button class="logout-btn" id="btn-logout">DISCONNECT SESSION</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://ahridkmlgjsmlqkqatrz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFocmlka21sZ2pzbWxxa3FhdHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjYwODUsImV4cCI6MjEwNTY0MjA4NX0.r_vPhWLs-hKg7xk6lyge8ITkPP30y53442jrGqNwhWQ';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.replace("index.html");
                return;
            }

            const { data: profile, error } = await supabaseClient
                .from('profiles')
                .select('codename, rank')
                .eq('id', session.user.id)
                .single();

            if (error || !profile) {
                alert("Security handshake failed. Logging out.");
                await supabaseClient.auth.signOut();
                window.location.replace("index.html");
                return;
            }

            const rank = (profile.rank || 'MEMBER').toUpperCase();
            const rankBadge = document.getElementById("user-rank");

            document.getElementById("user-codename").textContent = profile.codename || "UNKNOWN";
            rankBadge.textContent = rank;

            if (rank === 'FOUNDER') {
                rankBadge.style.color = '#ff4d4d';
                rankBadge.style.borderColor = '#ff4d4d';
            } else if (rank === 'COUNCIL') {
                rankBadge.style.color = '#c77dff';
                rankBadge.style.borderColor = '#c77dff';
            } else if (rank === 'SPECIALIST') {
                rankBadge.style.color = '#00e5ff';
                rankBadge.style.borderColor = '#00e5ff';
            } else {
                rankBadge.style.color = '#888';
                rankBadge.style.borderColor = '#444';
            }

            if (rank === 'FOUNDER' || rank === 'COUNCIL') {
                document.getElementById("btn-admin").style.display = "block";
                document.getElementById("btn-meeting").style.display = "block";
            }

            document.getElementById("dashboard-box").style.display = "block";

            document.getElementById("btn-logout").addEventListener("click", async () => {
                await supabaseClient.auth.signOut();
                window.location.replace("index.html");
            });
        });
    </script>
</body>
</html>
