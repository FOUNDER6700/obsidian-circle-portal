<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard | The Obsidian Circle</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .member-chat-btn { border-color: #555 !important; color: #aaa !important; }
        .specialist-chat-btn { border-color: rgba(0, 229, 255, 0.4) !important; color: #00e5ff !important; background-color: rgba(0, 229, 255, 0.03); }
        .council-chat-btn { border-color: rgba(199, 125, 255, 0.4) !important; color: #c77dff !important; background-color: rgba(157, 78, 221, 0.03); }
        .admin-btn { border-color: rgba(255, 77, 77, 0.4) !important; color: #ff4d4d !important; background-color: rgba(255, 77, 77, 0.03); }
        
        .logout-btn { background-color: transparent; color: #666; border: 1px solid #222; margin-top: 10px; width: 100%; padding: 14px; border-radius: 6px; font-weight: bold; letter-spacing: 2px; cursor: pointer; transition: all 0.3s;}
        .logout-btn:hover { color: #ff4d4d; border-color: #ff4d4d; background-color: rgba(255, 77, 77, 0.05); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .logout-btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div class="page-transition-overlay" id="transition-overlay"></div>
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-ring" id="cursor-ring"></div>
    <canvas id="particle-canvas"></canvas>
    <div class="ambient-light"></div>

    <div class="dashboard-container" id="main-container" style="display: none;">
        <div class="header-title" id="obsidian-title">THE OBSIDIAN CIRCLE</div>
        <div id="secret-msg" style="text-align:center; margin-bottom: 20px;">[ OMEGA CLEARANCE VERIFIED ]</div>

        <!-- Target for 3D Interaction -->
        <div class="profile-card" id="profile-card">
            <div class="profile-row">
                <span class="label">CODENAME</span>
                <span class="val-codename" id="user-codename">AUTHENTICATING...</span>
            </div>
            <div class="profile-row">
                <span class="label">CLEARANCE</span>
                <span class="badge-rank" id="user-rank">VERIFYING</span>
            </div>
        </div>

        <div class="menu-grid">
            <button class="menu-btn magnetic-btn nav-btn" data-target="projects.html">ACTIVE PROJECTS</button>
            <button class="menu-btn magnetic-btn nav-btn" data-target="teams.html">TEAMS / DIRECTORY</button>
            <button class="menu-btn magnetic-btn nav-btn" data-target="announcements.html">ANNOUNCEMENTS</button>
            
            <button class="menu-btn member-chat-btn magnetic-btn nav-btn" data-target="chat_member.html">[ GLOBAL MEMBER CHAT ]</button>
            <button class="menu-btn specialist-chat-btn magnetic-btn nav-btn" id="btn-chat-specialist" data-target="chat_specialist.html" style="display: none;">[ SPECIALIST COMM-LINK ]</button>
            <button class="menu-btn council-chat-btn magnetic-btn nav-btn" id="btn-chat-council" data-target="chat_council.html" style="display: none;">[ COUNCIL COMM-LINK ]</button>
            
            <button class="menu-btn council-chat-btn magnetic-btn nav-btn" id="btn-meeting" data-target="meeting.html" style="display: none;">COUNCIL CHAMBERS</button>
            <button class="menu-btn admin-btn magnetic-btn nav-btn" id="btn-admin" data-target="admin.html" style="display: none;">[ ADMIN PANEL ]</button>
        </div>

        <button class="logout-btn" id="btn-logout">DISCONNECT SESSION</button>
    </div>

    <script>
    // --- 1. Supabase Logic (Unaltered) ---
    const supabaseUrl = 'https://ahridkmlgjsmlqkqatrz.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFocmlka21sZ2pzbWxxa3FhdHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjYwODUsImV4cCI6MjEwNTY0MjA4NX0.r_vPhWLs-hKg7xk6lyge8ITkPP30y53442jrGqNwhWQ'; 
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    function smoothRoute(url) {
        document.getElementById('transition-overlay').classList.remove('loaded');
        setTimeout(() => window.location.href = url, 500);
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const { data: { user }, error } = await supabaseClient.auth.getUser();
        if (error || !user) { window.location.replace("index.html"); return; }

        const codename = user.email.split('@')[0].toUpperCase(); 
        const rank = codename.split('-')[0]; 

        document.getElementById("user-codename").textContent = codename;
        const rankEl = document.getElementById("user-rank");
        
        if (rankEl) {
            rankEl.textContent = rank;
            if (rank === 'FOUNDER') { rankEl.style.color = '#ff4d4d'; rankEl.style.borderColor = '#ff4d4d'; rankEl.style.boxShadow = '0 0 10px rgba(255, 77, 77, 0.4)'; } 
            else if (rank === 'COUNCIL') { rankEl.style.color = '#c77dff'; rankEl.style.borderColor = '#c77dff'; rankEl.style.boxShadow = '0 0 10px rgba(199, 125, 255, 0.4)'; } 
            else if (rank === 'SPECIALIST') { rankEl.style.color = '#00e5ff'; rankEl.style.borderColor = '#00e5ff'; rankEl.style.boxShadow = '0 0 10px rgba(0, 229, 255, 0.4)'; } 
            else { rankEl.style.color = '#888'; rankEl.style.borderColor = '#444'; }
        }

        const showElement = (id) => { const el = document.getElementById(id); if (el) el.style.display = "block"; };
        if (rank === 'FOUNDER' || rank === 'COUNCIL') {
            showElement("btn-admin"); showElement("btn-meeting"); showElement("btn-chat-council"); showElement("btn-chat-specialist");
        } else if (rank === 'SPECIALIST') { showElement("btn-chat-specialist"); }

        document.getElementById("main-container").style.display = "block";

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() { smoothRoute(this.getAttribute('data-target')); });
        });

        const logoutBtn = document.getElementById("btn-logout");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", async () => {
                await supabaseClient.auth.signOut();
                smoothRoute("index.html");
            });
        }

        new ObsidianMotion(); 
    });

    // --- 2. Advanced Motion Architecture ---
    class ObsidianMotion {
        constructor() {
            this.isDesktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
            this.prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            
            this.mouseX = window.innerWidth / 2; this.mouseY = window.innerHeight / 2;
            this.lerpX = this.mouseX; this.lerpY = this.mouseY;
            
            this.canvas = document.getElementById('particle-canvas');
            this.ctx = this.canvas.getContext('2d');
            this.particles = [];
            this.particleCount = this.isDesktop ? 30 : 15; // Lower count on dashboard for performance

            this.init();
        }

        init() {
            // Dashboard load sequencing
            document.getElementById('transition-overlay').classList.add('loaded');
            this.cinematicTextReveal();
            setTimeout(() => document.getElementById('main-container').classList.add('animation-complete'), 1200);

            this.initEasterEgg();
            this.initParticles();
            
            if (this.prefersReduced) return;

            if (this.isDesktop) {
                window.addEventListener('mousemove', (e) => { this.mouseX = e.clientX; this.mouseY = e.clientY; });
                this.initCursor();
                this.initMagneticButtons();
                this.init3DCard();
                this.tick(); 
            }
        }

        cinematicTextReveal() {
            const title = document.getElementById('obsidian-title');
            const text = title.innerText;
            title.innerHTML = '';
            
            text.split(' ').forEach((word, wordIdx, wordsArr) => {
                word.split('').forEach((char, charIdx) => {
                    const span = document.createElement('span');
                    span.innerText = char;
                    span.className = 'char-span';
                    setTimeout(() => span.classList.add('revealed'), (wordIdx * 100) + (charIdx * 30) + 300);
                    title.appendChild(span);
                });
                if (wordIdx < wordsArr.length - 1) title.appendChild(document.createTextNode('\u00A0'));
            });
            setTimeout(() => title.classList.add('glow-active'), 1500);
        }

        initEasterEgg() {
            let clicks = 0;
            document.getElementById('obsidian-title').addEventListener('click', function() {
                clicks++;
                if (clicks === 5) {
                    this.classList.add('glitch-active');
                    document.getElementById('secret-msg').style.display = 'block';
                    setTimeout(() => { this.classList.remove('glitch-active'); document.getElementById('secret-msg').style.display = 'none'; clicks = 0; }, 3000);
                }
            });
        }

        initCursor() {
            this.dot = document.getElementById('cursor-dot');
            this.ring = document.getElementById('cursor-ring');
            document.body.style.cursor = 'none';
            
            document.querySelectorAll('button, .profile-card').forEach(el => {
                el.addEventListener('mouseenter', () => this.ring.classList.add('hovering'));
                el.addEventListener('mouseleave', () => this.ring.classList.remove('hovering'));
            });
        }

        initMagneticButtons() {
            document.querySelectorAll('.magnetic-btn').forEach(btn => {
                btn.addEventListener('mousemove', (e) => {
                    const rect = btn.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;
                    btn.style.transform = `translate(${x * 0.1}px, ${y * 0.15}px)`; // Slightly weaker magnet for menu layout
                });
                btn.addEventListener('mouseleave', () => { btn.style.transform = ''; });
            });
        }

        init3DCard() {
            const card = document.getElementById('profile-card');
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left; // x position within the element
                const y = e.clientY - rect.top;  // y position within the element
                
                // Calculate rotation (center is 0)
                const rotateY = -1 * ((window.innerWidth / 2 - e.clientX) / 40);
                const rotateX = ((window.innerHeight / 2 - e.clientY) / 40);
                
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(10px)`;
                
                // Update localized glare position
                card.style.setProperty('--card-glare-x', `${(x / rect.width) * 100}%`);
                card.style.setProperty('--card-glare-y', `${(y / rect.height) * 100}%`);
            });
            
            card.addEventListener('mouseleave', () => {
                card.style.transform = ''; // Snaps back
            });
        }

        initParticles() {
            const resize = () => { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; };
            window.addEventListener('resize', resize); resize();

            for (let i = 0; i < this.particleCount; i++) {
                this.particles.push({
                    x: Math.random() * this.canvas.width, y: Math.random() * this.canvas.height,
                    vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 1.5 + 0.5
                });
            }
            if (!this.isDesktop) { setInterval(() => this.drawParticles(), 1000 / 30); }
        }

        drawParticles() {
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            this.particles.forEach(p => {
                if (this.isDesktop) {
                    let dx = this.mouseX - p.x; let dy = this.mouseY - p.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) { p.vx -= (dx / dist) * 0.02; p.vy -= (dy / dist) * 0.02; }
                }
                p.vx *= 0.98; p.vy *= 0.98;
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > this.canvas.height) p.vy *= -1;
                this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; this.ctx.fill();
            });
        }

        tick() {
            this.lerpX += (this.mouseX - this.lerpX) * 0.1;
            this.lerpY += (this.mouseY - this.lerpY) * 0.1;

            this.dot.style.transform = `translate(calc(${this.mouseX}px - 50%), calc(${this.mouseY}px - 50%))`;
            this.ring.style.transform = `translate(calc(${this.lerpX}px - 50%), calc(${this.lerpY}px - 50%))`;

            document.documentElement.style.setProperty('--mouse-x', `${this.lerpX}px`);
            document.documentElement.style.setProperty('--mouse-y', `${this.lerpY}px`);

            const rotX = (window.innerHeight / 2 - this.lerpY) / 50;
            const rotY = (this.lerpX - window.innerWidth / 2) / 50;
            document.documentElement.style.setProperty('--rotate-x', `${rotX}deg`);
            document.documentElement.style.setProperty('--rotate-y', `${rotY}deg`);

            this.drawParticles();
            requestAnimationFrame(() => this.tick());
        }
    }
    </script>
</body>
</html>
