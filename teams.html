<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Active Teams | The Obsidian Circle</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .teams-container {
            width: 100%; max-width: 600px; margin: 0 auto;
            background-color: #121215; padding: 30px 20px;
            border-radius: 8px; border: 1px solid #333;
        }
        .header-title {
            text-align: center; margin-bottom: 20px; font-size: 18px;
            letter-spacing: 3px; color: #a0a0b0;
        }
        .team-count { color: #fff; font-weight: bold; }
        
        .create-box {
            background-color: #070709; border: 1px solid #333; padding: 15px;
            border-radius: 4px; margin-bottom: 25px;
        }
        .create-title { font-size: 12px; color: #a0a0b0; letter-spacing: 2px; margin-bottom: 10px; font-weight: bold; }
        input[type="text"] {
            width: 100%; padding: 12px; margin-bottom: 10px; background-color: #121215; 
            border: 1px solid #444; color: #fff; border-radius: 4px; font-family: monospace; box-sizing: border-box;
        }
        .action-btn {
            background-color: #4CAF50; color: #fff; border: none; width: 100%;
            padding: 12px; border-radius: 4px; font-size: 14px; font-weight: bold; letter-spacing: 1px; cursor: pointer;
        }

        .team-card {
            background-color: #070709; border: 1px solid #444; border-left: 4px solid #6c757d;
            padding: 15px; margin-bottom: 15px; border-radius: 4px; position: relative;
        }
        .my-team-card { border-left: 4px solid #4CAF50; }
        .team-name { font-size: 16px; font-weight: bold; color: #fff; letter-spacing: 1px; margin-bottom: 8px; }
        .team-focus { font-size: 13px; color: #aaa; margin-bottom: 10px; line-height: 1.4; }
        .team-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .team-lead { font-size: 11px; color: #666; letter-spacing: 1px; }
        .capacity-meter { font-size: 11px; font-weight: bold; letter-spacing: 1px; }
        
        .join-btn { background-color: #333; color: #fff; border: 1px solid #555; padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; letter-spacing: 1px; }
        .join-btn:hover { background-color: #4CAF50; border-color: #4CAF50; }
        .leave-btn { background-color: #333; color: #ff5555; border: 1px solid #ff5555; padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; letter-spacing: 1px; }
        .chat-toggle-btn { background-color: #4CAF50; color: #fff; border: 1px solid #4CAF50; padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; letter-spacing: 1px; margin-right: 5px; }

        /* Integrated Chat Box Styles */
        .chat-box { background-color: #000; border: 1px solid #333; border-radius: 4px; margin-top: 15px; display: none; }
        .chat-history { height: 180px; overflow-y: auto; padding: 10px; font-size: 13px; color: #ccc; }
        .chat-history p { margin: 0 0 8px 0; line-height: 1.4; }
        .chat-sender { color: #4CAF50; font-weight: bold; }
        .chat-controls { display: flex; border-top: 1px solid #333; }
        .chat-controls input { flex: 1; border: none; background: transparent; padding: 10px; margin: 0; color: #fff; font-size: 13px; outline: none; }
        .chat-controls button { background-color: #333; color: #fff; border: none; padding: 0 15px; font-weight: bold; cursor: pointer; }

        .back-btn { background-color: #333; color: #fff; margin-top: 20px; border: none; width: 100%; padding: 14px; border-radius: 4px; font-size: 14px; font-weight: bold; letter-spacing: 2px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="teams-container" id="main-box" style="display: none;">
        <div class="header-title">◎ ACTIVE TEAMS [ <span class="team-count" id="count-display">-</span> ]</div>
        
        <div class="create-box" id="deploy-panel">
            <div class="create-title">+ DEPLOY NEW TEAM</div>
            <input type="text" id="input-team-name" placeholder="TEAM NAME" autocomplete="off">
            <input type="text" id="input-team-focus" placeholder="PRIMARY FOCUS AREA" autocomplete="off">
            <input type="text" id="input-team-code" placeholder="SET SECRET INVITE CODE" autocomplete="off">
            <button class="action-btn" id="btn-create">AUTHORIZE DEPLOYMENT</button>
        </div>

        <div id="teams-list">
            <div style="text-align: center; color: #888; font-size: 12px;">DECRYPTING ROSTERS...</div>
        </div>

        <button class="back-btn" onclick="window.location.href='dashboard.html'">RETURN TO DASHBOARD</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://ahridkmlgjsmlqkqatrz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFocmlka21sZ2pzbWxxa3FhdHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjYwODUsImV4cCI6MjEwNTY0MjA4NX0.r_vPhWLs-hKg7xk6lyge8ITkPP30y53442jrGqNwhWQ';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let myCodename = "UNKNOWN";
        let myUserId = null;
        let myActiveTeam = "NONE";
        let chatInterval = null;

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.replace("index.html"); return; }
            myUserId = session.user.id;

            document.getElementById("main-box").style.display = "block";

            await fetchProfile();
            loadTeams();

            document.getElementById("btn-create").addEventListener("click", async () => {
                if (myActiveTeam !== "NONE") { alert("DEPLOYMENT BLOCKED: You must leave your current team first."); return; }
                const tName = document.getElementById("input-team-name").value.trim().toUpperCase();
                const tFocus = document.getElementById("input-team-focus").value.trim();
                const tCode = document.getElementById("input-team-code").value.trim();

                if (!tName || !tFocus || !tCode) { alert("Please provide all fields."); return; }

                const { error } = await supabaseClient.from('teams').insert([{ team_name: tName, focus_area: tFocus, invite_code: tCode, lead_codename: myCodename }]);
                if (error) { alert("DEPLOYMENT REJECTED."); } else {
                    await supabaseClient.from('profiles').update({ active_team: tName }).eq('id', myUserId);
                    document.getElementById("input-team-name").value = "";
                    document.getElementById("input-team-focus").value = "";
                    document.getElementById("input-team-code").value = "";
                    await fetchProfile();
                    loadTeams();
                }
            });
        });

        async function fetchProfile() {
            const { data: profile } = await supabaseClient.from('profiles').select('codename, active_team').eq('id', myUserId).single();
            if (profile) { myCodename = profile.codename; myActiveTeam = profile.active_team || "NONE"; }
            document.getElementById("deploy-panel").style.display = (myActiveTeam !== "NONE") ? "none" : "block";
        }

        window.joinTeam = async function(teamId, teamName, currentCount, actualCode) {
            if (currentCount >= 4) { alert("TEAM FULL."); return; }
            const userAttempt = prompt("ENTER TEAM INVITE CODE:");
            if (userAttempt === null) return; 
            if (userAttempt !== actualCode) { alert("ACCESS DENIED."); return; }
            
            await supabaseClient.from('teams').update({ member_count: currentCount + 1 }).eq('id', teamId);
            await supabaseClient.from('profiles').update({ active_team: teamName }).eq('id', myUserId);
            await fetchProfile();
            loadTeams(); 
        };

        window.leaveTeam = async function(teamId, currentCount) {
            if (!confirm("Are you sure you want to leave this team?")) return;
            await supabaseClient.from('teams').update({ member_count: currentCount - 1 }).eq('id', teamId);
            await supabaseClient.from('profiles').update({ active_team: 'NONE' }).eq('id', myUserId);
            clearInterval(chatInterval); // Stop refreshing chat
            await fetchProfile();
            loadTeams();
        };

        window.toggleChat = function(teamName) {
            const box = document.getElementById('chat-box-' + teamName);
            if (box.style.display === 'none' || box.style.display === '') {
                box.style.display = 'block';
                loadChat(teamName);
                chatInterval = setInterval(() => loadChat(teamName), 3000); // Auto-refresh every 3 seconds
            } else {
                box.style.display = 'none';
                clearInterval(chatInterval);
            }
        };

        window.loadChat = async function(teamName) {
            const { data } = await supabaseClient.from('team_messages').select('*').eq('team_name', teamName).order('created_at', { ascending: true });
            const history = document.getElementById('history-' + teamName);
            if (data && history) {
                const isAtBottom = history.scrollHeight - history.scrollTop === history.clientHeight;
                history.innerHTML = data.map(msg => `<p><span class="chat-sender">${msg.sender_codename}:</span> ${msg.message}</p>`).join('');
                if (isAtBottom) history.scrollTop = history.scrollHeight;
            }
        };

        window.sendMsg = async function(teamName) {
            const input = document.getElementById('input-' + teamName);
            const text = input.value.trim();
            if (!text) return;
            
            input.value = "";
            await supabaseClient.from('team_messages').insert([{ team_name: teamName, sender_codename: myCodename, message: text }]);
            loadChat(teamName);
        };

        async function loadTeams() {
            const { data: teams, error } = await supabaseClient.from('teams').select('*').order('created_at', { ascending: false });
            const listContainer = document.getElementById("teams-list");
            const countDisplay = document.getElementById("count-display");
            
            if (error) { listContainer.innerHTML = `<div style="color:red; text-align:center;">Clearance Denied.</div>`; return; }
            countDisplay.textContent = teams.length;
            listContainer.innerHTML = ""; 

            if (teams.length === 0) { listContainer.innerHTML = `<div style="text-align:center; color:#888;">0 ACTIVE TEAMS PRESENT.</div>`; return; }

            teams.forEach(team => {
                const isFull = team.member_count >= 4;
                const capacityColor = isFull ? "#ff5555" : "#4CAF50";
                const isMyTeam = myActiveTeam === team.team_name;
                
                let actionHtml = "";
                let chatHtml = "";

                if (isMyTeam) {
                    actionHtml = `
                        <button class="chat-toggle-btn" onclick="toggleChat('${team.team_name}')">COMM-LINK</button>
                        <button class="leave-btn" onclick="leaveTeam(${team.id}, ${team.member_count})">LEAVE</button>
                    `;
                    chatHtml = `
                        <div class="chat-box" id="chat-box-${team.team_name}">
                            <div class="chat-history" id="history-${team.team_name}"><div style="text-align:center; color:#555; margin-top:20px;">Establishing secure connection...</div></div>
                            <div class="chat-controls">
                                <input type="text" id="input-${team.team_name}" placeholder="Transmit message..." autocomplete="off">
                                <button onclick="sendMsg('${team.team_name}')">SEND</button>
                            </div>
                        </div>
                    `;
                } else if (myActiveTeam !== "NONE") {
                    actionHtml = `<div style="font-size: 11px; color: #666; font-weight: bold;">[ INELIGIBLE ]</div>`;
                } else if (isFull) {
                    actionHtml = `<div style="font-size: 11px; color: #ff5555; font-weight: bold;">[ LOCKED ]</div>`;
                } else {
                    actionHtml = `<button class="join-btn" onclick="joinTeam(${team.id}, '${team.team_name}', ${team.member_count}, '${team.invite_code}')">JOIN TEAM</button>`;
                }
                
                const card = document.createElement("div");
                card.className = "team-card" + (isMyTeam ? " my-team-card" : "");
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <div class="team-name">${team.team_name}</div>
                        <div>${actionHtml}</div>
                    </div>
                    <div class="team-focus">FOCUS: ${team.focus_area}</div>
                    <div class="team-footer">
                        <div class="team-lead">LEAD: ${team.lead_codename}</div>
                        <div class="capacity-meter" style="color: ${capacityColor};">CAPACITY: ${team.member_count} / 4</div>
                    </div>
                    ${chatHtml}
                `;
                listContainer.appendChild(card);
            });
        }
    </script>
</body>
    </html>
