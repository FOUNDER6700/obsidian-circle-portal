<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Obsidian Circle - Secure Portal</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* PREMIUM OBSIDIAN THEME & ANIMATIONS */
        :root {
            --bg-dark: #050507;
            --container-bg: rgba(15, 15, 18, 0.85);
            --border-color: #2a2a30;
            --text-main: #e0e0e0;
            --text-muted: #737373;
            --accent: #555;
            --accent-glow: rgba(255, 255, 255, 0.1);
            --error-red: #ff4c4c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body { 
            background: linear-gradient(135deg, #000000 0%, #08080a 50%, #000000 100%);
            background-size: 200% 200%;
            animation: ambientShift 15s ease infinite;
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }

        /* Ambient Background Movement */
        @keyframes ambientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Page Load Animation */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-container { 
            background-color: var(--container-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255,255,255,0.05); 
            width: 100%; 
            max-width: 380px; 
            text-align: center; 
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        h1 { font-size: 20px; letter-spacing: 3px; margin-bottom: 8px; color: #ffffff; text-shadow: 0 2px 10px rgba(255,255,255,0.1); }
        h2 { font-size: 13px; color: var(--text-muted); margin-bottom: 35px; letter-spacing: 2px; }
        
        input { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 16px; 
            background-color: #050505; 
            border: 1px solid var(--border-color); 
            color: #fff; 
            border-radius: 4px; 
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.3s ease; 
        }
        
        input:focus { 
            outline: none; 
            border-color: #888; 
            box-shadow: 0 0 15px rgba(255,255,255,0.05);
            transform: translateY(-1px);
        }

        button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 10px;
            background-color: #222; 
            color: #fff; 
            border: 1px solid #444; 
            cursor: pointer; 
            font-weight: bold; 
            letter-spacing: 2px; 
            border-radius: 4px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        /* Smooth Hover & Mobile Touch Feedback */
        button:hover:not(:disabled) { 
            background-color: #333; 
            border-color: #666;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transform: translateY(-2px);
        }
        button:active:not(:disabled) {
            transform: translateY(0) scale(0.97);
        }
        
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        
        #error-msg { 
            margin-top: 20px; 
            font-size: 12px; 
            font-weight: bold; 
            color: var(--error-red); 
            display: none; 
            letter-spacing: 1px;
            animation: slideUpFade 0.3s ease-out forwards;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>THE OBSIDIAN CIRCLE</h1>
        <h2>RESTRICTED ACCESS</h2>

        <form id="login-form" onsubmit="handleLogin(event)">
            <input type="text" id="email" placeholder="ENTER ID (e.g. COUNCIL-01)" required autocomplete="off">
            <input type="password" id="password" placeholder="PASSWORD" required>
            <button type="submit" id="login-btn">INITIATE LOGIN</button>
        </form>
        
        <p id="error-msg"></p>
    </div>

    <script>
        const supabaseUrl = 'https://ahridkmlgjsmlqkqatrz.supabase.co';
        
        // This MUST start with a lowercase 'e'. 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFocmlka21sZ2pzbWxxa3FhdHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjYwODUsImV4cCI6MjEwNTY0MjA4NX0.r_vPhWLs-hKg7xk6lyge8ITkPP30y53442jrGqNwhWQ'; 
        
        let supabaseClient;
        try {
            supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        } catch (err) {
            document.getElementById("error-msg").textContent = "SYSTEM ERROR: SUPABASE CDN FAILED TO LOAD.";
            document.getElementById("error-msg").style.display = "block";
        }

        async function handleLogin(event) {
            event.preventDefault(); 

            let inputId = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("error-msg");
            const loginBtn = document.getElementById("login-btn");

            errorMsg.style.display = "none";

            if (!inputId.includes('@')) {
                inputId = inputId.toLowerCase() + '@obsidian.com';
            }

            loginBtn.textContent = "AUTHENTICATING...";
            loginBtn.disabled = true;

            if (!supabaseClient) {
                errorMsg.textContent = "CONNECTION FAILED: SYSTEM NOT INITIALIZED.";
                errorMsg.style.display = "block";
                loginBtn.textContent = "INITIATE LOGIN";
                loginBtn.disabled = false;
                return;
            }
            
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: inputId,
                    password: password
                });

                if (error) {
                    errorMsg.textContent = "ACCESS DENIED: " + error.message.toUpperCase();
                    errorMsg.style.display = "block";
                    loginBtn.textContent = "INITIATE LOGIN";
                    loginBtn.disabled = false;
                } else {
                    window.location.replace("dashboard.html");
                }
            } catch (err) {
                errorMsg.textContent = "CONNECTION FAILED: " + err.message.toUpperCase();
                errorMsg.style.display = "block";
                loginBtn.textContent = "INITIATE LOGIN";
                loginBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
