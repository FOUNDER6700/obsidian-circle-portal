<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Obsidian Circle - Secure Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    
    <!-- Advanced UI Layers -->
    <div class="page-transition-overlay" id="transition-overlay"></div>
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-ring" id="cursor-ring"></div>
    <canvas id="particle-canvas"></canvas>
    <div class="ambient-light"></div>

    <div class="login-container" id="parallax-container">
        <h1 id="obsidian-title">THE OBSIDIAN CIRCLE</h1>
        <h2>RESTRICTED ACCESS</h2>
        <div id="secret-msg">[ OMEGA CLEARANCE VERIFIED ]</div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <input type="text" id="email" placeholder="ENTER ID (e.g. COUNCIL-01)" required autocomplete="off">
            <input type="password" id="password" placeholder="PASSWORD" required>
            <button type="submit" id="login-btn">INITIATE LOGIN</button>
        </form>
        
        <p id="error-msg"></p>
    </div>

    <!-- UI/UX Engine & Authentication -->
    <script>
        // --- 1. Page Transition In ---
        window.onload = () => {
            document.getElementById('transition-overlay').classList.add('loaded');
        };

        // --- 2. Supabase Auth ---
        const supabaseUrl = 'https://ahridkmlgjsmlqkqatrz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFocmlka21sZ2pzbWxxa3FhdHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjYwODUsImV4cCI6MjEwNTY0MjA4NX0.r_vPhWLs-hKg7xk6lyge8ITkPP30y53442jrGqNwhWQ'; 
        let supabaseClient;
        
        try {
            supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        } catch (err) {
            document.getElementById("error-msg").textContent = "SYSTEM ERROR: SUPABASE CDN FAILED TO LOAD.";
            document.getElementById("error-msg").style.display = "block";
        }

        async function handleLogin(event) {
            event.preventDefault(); 
            let inputId = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("error-msg");
            const loginBtn = document.getElementById("login-btn");

            errorMsg.style.display = "none";
            if (!inputId.includes('@')) inputId = inputId.toLowerCase() + '@obsidian.com';

            loginBtn.textContent = "AUTHENTICATING...";
            loginBtn.disabled = true;

            if (!supabaseClient) return;
            
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email: inputId, password: password });
                if (error) {
                    errorMsg.textContent = "ACCESS DENIED: " + error.message.toUpperCase();
                    errorMsg.style.display = "block";
                    loginBtn.textContent = "INITIATE LOGIN";
                    loginBtn.disabled = false;
                } else {
                    // Smooth Transition Out
                    document.getElementById('transition-overlay').classList.remove('loaded');
                    setTimeout(() => window.location.replace("dashboard.html"), 400);
                }
            } catch (err) {
                errorMsg.textContent = "CONNECTION FAILED.";
                errorMsg.style.display = "block";
                loginBtn.textContent = "INITIATE LOGIN";
                loginBtn.disabled = false;
            }
        }

        // --- 3. Advanced Visual Engine ---
        (function initAdvancedUI() {
            const isTouch = window.matchMedia('(pointer: coarse)').matches;
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            
            // Easter Egg Logic
            let clicks = 0;
            document.getElementById('obsidian-title').addEventListener('click', function() {
                clicks++;
                if (clicks === 5) {
                    this.classList.add('glitch-active');
                    document.getElementById('secret-msg').style.display = 'block';
                    setTimeout(() => { this.classList.remove('glitch-active'); document.getElementById('secret-msg').style.display = 'none'; clicks = 0; }, 3000);
                }
            });

            if (prefersReducedMotion) return; // Halt heavy graphics

            // Custom Cursor & Parallax (Desktop Only)
            if (!isTouch) {
                const dot = document.getElementById('cursor-dot');
                const ring = document.getElementById('cursor-ring');
                const pContainer = document.getElementById('parallax-container');

                window.addEventListener('mousemove', (e) => {
                    // Cursor Follow
                    dot.style.transform = `translate(calc(${e.clientX}px - 50%), calc(${e.clientY}px - 50%))`;
                    ring.style.transform = `translate(calc(${e.clientX}px - 50%), calc(${e.clientY}px - 50%))`;
                    
                    // Ambient Light Tracking
                    document.documentElement.style.setProperty('--mouse-x', `${e.clientX}px`);
                    document.documentElement.style.setProperty('--mouse-y', `${e.clientY}px`);
                    
                    // 3D Parallax Depth
                    const x = (window.innerWidth / 2 - e.clientX) / 40;
                    const y = (window.innerHeight / 2 - e.clientY) / 40;
                    pContainer.style.transform = `rotateY(${x}deg) rotateX(${y}deg) translateY(${y}px)`;
                });

                // Hover states for cursor
                document.querySelectorAll('button, input').forEach(el => {
                    el.addEventListener('mouseenter', () => ring.classList.add('hovering'));
                    el.addEventListener('mouseleave', () => ring.classList.remove('hovering'));
                });
            }

            // Lightweight Canvas Particles
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            const pCount = isTouch ? 20 : 45; // Reduce on mobile
            
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.vx = (Math.random() - 0.5) * 0.5;
                    this.vy = (Math.random() - 0.5) * 0.5;
                    this.size = Math.random() * 1.5;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.fill();
                }
            }
            
            for (let i = 0; i < pCount; i++) particles.push(new Particle());
            
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>
</body>
</html>
