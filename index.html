<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Obsidian Circle - Secure Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    
    <div class="page-transition-overlay" id="transition-overlay"></div>
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-ring" id="cursor-ring"></div>
    <canvas id="particle-canvas"></canvas>
    <div class="ambient-light"></div>

    <div class="login-container" id="main-container">
        <!-- Cinematic Text Reveal Target -->
        <h1 id="obsidian-title">THE OBSIDIAN CIRCLE</h1>
        <h2>RESTRICTED ACCESS</h2>
        <div id="secret-msg">[ OMEGA CLEARANCE VERIFIED ]</div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <input type="text" id="email" placeholder="ENTER ID (e.g. COUNCIL-01)" required autocomplete="off">
            <input type="password" id="password" placeholder="PASSWORD" required>
            <button type="submit" id="login-btn" class="magnetic-btn">INITIATE LOGIN</button>
        </form>
        
        <p id="error-msg"></p>
    </div>

    <script>
        // --- 1. Supabase Authentication (Unaltered) ---
        const supabaseUrl = 'https://ahridkmlgjsmlqkqatrz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFocmlka21sZ2pzbWxxa3FhdHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjYwODUsImV4cCI6MjEwNTY0MjA4NX0.r_vPhWLs-hKg7xk6lyge8ITkPP30y53442jrGqNwhWQ'; 
        let supabaseClient;
        try { supabaseClient = supabase.createClient(supabaseUrl, supabaseKey); } 
        catch (err) {
            document.getElementById("error-msg").textContent = "SYSTEM ERROR: SUPABASE CDN FAILED.";
            document.getElementById("error-msg").style.display = "block";
        }

        async function handleLogin(event) {
            event.preventDefault(); 
            let inputId = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("error-msg");
            const loginBtn = document.getElementById("login-btn");

            errorMsg.style.display = "none";
            if (!inputId.includes('@')) inputId = inputId.toLowerCase() + '@obsidian.com';

            loginBtn.textContent = "AUTHENTICATING...";
            loginBtn.disabled = true;

            if (!supabaseClient) return;
            
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email: inputId, password: password });
                if (error) {
                    errorMsg.textContent = "ACCESS DENIED: " + error.message.toUpperCase();
                    errorMsg.style.display = "block";
                    loginBtn.textContent = "INITIATE LOGIN";
                    loginBtn.disabled = false;
                } else {
                    document.getElementById('transition-overlay').classList.remove('loaded');
                    setTimeout(() => window.location.replace("dashboard.html"), 500); // Matched to CSS transition speed
                }
            } catch (err) {
                errorMsg.textContent = "CONNECTION FAILED.";
                errorMsg.style.display = "block";
                loginBtn.textContent = "INITIATE LOGIN";
                loginBtn.disabled = false;
            }
        }

        // --- 2. Advanced Motion Architecture ---
        class ObsidianMotion {
            constructor() {
                this.isDesktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
                this.prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                
                // Lerp state
                this.mouseX = window.innerWidth / 2; this.mouseY = window.innerHeight / 2;
                this.lerpX = this.mouseX; this.lerpY = this.mouseY;
                
                // Particle system
                this.canvas = document.getElementById('particle-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.particleCount = this.isDesktop ? 40 : 20;

                this.init();
            }

            init() {
                // Intro Transition
                window.onload = () => {
                    document.getElementById('transition-overlay').classList.add('loaded');
                    this.cinematicTextReveal();
                    setTimeout(() => document.getElementById('main-container').classList.add('animation-complete'), 1200);
                };

                // Easter Egg
                this.initEasterEgg();

                // Particle Engine
                this.initParticles();
                
                if (this.prefersReduced) return;

                // Heavy interactions restricted to Desktop
                if (this.isDesktop) {
                    window.addEventListener('mousemove', (e) => { this.mouseX = e.clientX; this.mouseY = e.clientY; });
                    this.initCursor();
                    this.initMagneticButtons();
                    this.tick(); // Start single requestAnimationFrame loop
                }
            }

            cinematicTextReveal() {
                const title = document.getElementById('obsidian-title');
                const text = title.innerText;
                title.innerHTML = '';
                
                // Split words to preserve spacing, wrap letters in spans
                text.split(' ').forEach((word, wordIdx, wordsArr) => {
                    word.split('').forEach((char, charIdx) => {
                        const span = document.createElement('span');
                        span.innerText = char;
                        span.className = 'char-span';
                        // Stagger delay based on index
                        setTimeout(() => span.classList.add('revealed'), (wordIdx * 100) + (charIdx * 30) + 400);
                        title.appendChild(span);
                    });
                    if (wordIdx < wordsArr.length - 1) title.appendChild(document.createTextNode('\u00A0')); // Space
                });

                // Add glowing class after reveal completes
                setTimeout(() => title.classList.add('glow-active'), 1500);
            }

            initEasterEgg() {
                let clicks = 0;
                document.getElementById('obsidian-title').addEventListener('click', function() {
                    clicks++;
                    if (clicks === 5) {
                        this.classList.add('glitch-active');
                        document.getElementById('secret-msg').style.display = 'block';
                        setTimeout(() => { this.classList.remove('glitch-active'); document.getElementById('secret-msg').style.display = 'none'; clicks = 0; }, 3000);
                    }
                });
            }

            initCursor() {
                this.dot = document.getElementById('cursor-dot');
                this.ring = document.getElementById('cursor-ring');
                document.body.style.cursor = 'none';
                
                document.querySelectorAll('button, input').forEach(el => {
                    el.addEventListener('mouseenter', () => this.ring.classList.add('hovering'));
                    el.addEventListener('mouseleave', () => this.ring.classList.remove('hovering'));
                });
            }

            initMagneticButtons() {
                document.querySelectorAll('.magnetic-btn').forEach(btn => {
                    btn.addEventListener('mousemove', (e) => {
                        const rect = btn.getBoundingClientRect();
                        const x = e.clientX - rect.left - rect.width / 2;
                        const y = e.clientY - rect.top - rect.height / 2;
                        btn.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px)`;
                    });
                    btn.addEventListener('mouseleave', () => {
                        btn.style.transform = ''; // Snaps back using CSS spring
                    });
                });
            }

            initParticles() {
                const resize = () => { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; };
                window.addEventListener('resize', resize); resize();

                for (let i = 0; i < this.particleCount; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width, y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
                        size: Math.random() * 1.5 + 0.5
                    });
                }
                
                // If mobile, start a simple interval loop to save battery instead of rAF
                if (!this.isDesktop) {
                    setInterval(() => this.drawParticles(), 1000 / 30);
                }
            }

            drawParticles() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.particles.forEach(p => {
                    // Pointer repel
                    if (this.isDesktop) {
                        let dx = this.mouseX - p.x; let dy = this.mouseY - p.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 120) { p.vx -= (dx / dist) * 0.02; p.vy -= (dy / dist) * 0.02; }
                    }
                    
                    p.vx *= 0.98; p.vy *= 0.98;
                    p.x += p.vx; p.y += p.vy;
                    
                    if (p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > this.canvas.height) p.vy *= -1;

                    this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    this.ctx.fill();
                });
            }

            tick() {
                // Lerp logic for smooth tracking
                this.lerpX += (this.mouseX - this.lerpX) * 0.1;
                this.lerpY += (this.mouseY - this.lerpY) * 0.1;

                // Update cursor
                this.dot.style.transform = `translate(calc(${this.mouseX}px - 50%), calc(${this.mouseY}px - 50%))`;
                this.ring.style.transform = `translate(calc(${this.lerpX}px - 50%), calc(${this.lerpY}px - 50%))`;

                // Update Ambient Spotlight CSS Variables
                document.documentElement.style.setProperty('--mouse-x', `${this.lerpX}px`);
                document.documentElement.style.setProperty('--mouse-y', `${this.lerpY}px`);

                // Update Container Parallax (Smooth depth)
                const rotX = (window.innerHeight / 2 - this.lerpY) / 50;
                const rotY = (this.lerpX - window.innerWidth / 2) / 50;
                document.documentElement.style.setProperty('--rotate-x', `${rotX}deg`);
                document.documentElement.style.setProperty('--rotate-y', `${rotY}deg`);

                this.drawParticles();
                requestAnimationFrame(() => this.tick());
            }
        }

        // Boot engine
        new ObsidianMotion();
    </script>
</body>
</html>
