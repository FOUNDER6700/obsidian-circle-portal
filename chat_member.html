<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Chat | The Obsidian Circle</title>
    <style>
        body { background-color: #000; color: #fff; font-family: monospace; margin: 0; padding: 20px; }
        .chat-container { max-width: 600px; margin: 0 auto; background-color: #121215; padding: 20px; border-radius: 8px; border: 1px solid #444; }
        .header-title { text-align: center; margin-bottom: 20px; font-size: 16px; letter-spacing: 2px; color: #ccc; font-weight: bold; }
        .chat-box { background-color: #070709; border: 1px solid #333; height: 400px; overflow-y: auto; padding: 15px; margin-bottom: 15px; border-radius: 4px; display: flex; flex-direction: column; gap: 10px; }
        .msg { font-size: 13px; line-height: 1.4; word-wrap: break-word; }
        .msg-author { font-weight: bold; color: #888; margin-right: 5px; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; background-color: #000; border: 1px solid #555; color: #fff; border-radius: 4px; font-family: monospace; }
        button { background-color: #444; color: #fff; border: none; padding: 0 20px; border-radius: 4px; font-weight: bold; cursor: pointer; letter-spacing: 1px; }
        .back-btn { background-color: #222; color: #fff; margin-top: 15px; border: none; width: 100%; padding: 12px; border-radius: 4px; font-size: 12px; letter-spacing: 1px; cursor: pointer; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="chat-container">
        <div class="header-title">◎ GLOBAL MEMBER CHAT ◎</div>
        <div class="chat-box" id="chat-box">
            <div style="color: #666; text-align: center; font-size: 12px;">DECRYPTING FEED...</div>
        </div>
        <div class="input-group">
            <input type="text" id="msg-input" placeholder="TRANSMIT MESSAGE..." autocomplete="off">
            <button onclick="sendMessage()">SEND</button>
        </div>
        <button class="back-btn" onclick="window.location.href='dashboard.html'">RETURN TO DASHBOARD</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://ahridkmlgjsmlqkqatrz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFocmlka21sZ2pzbWxxa3FhdHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjYwODUsImV4cCI6MjEwNTY0MjA4NX0.r_vPhWLs-hKg7xk6lyge8ITkPP30y53442jrGqNwhWQ';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let myCodename = "UNKNOWN";
        const ROOM_TIER = "MEMBER";

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.replace("index.html"); return; }

            const { data: profile } = await supabaseClient.from('profiles').select('codename').eq('id', session.user.id).single();
            if (profile) myCodename = profile.codename;

            loadMessages();
            setInterval(loadMessages, 3000); // Refreshes chat every 3 seconds
        });

        async function loadMessages() {
            const { data, error } = await supabaseClient.from('rank_chats').select('*').eq('room_tier', ROOM_TIER).order('created_at', { ascending: true });
            if (error) return;

            const box = document.getElementById("chat-box");
            box.innerHTML = "";
            data.forEach(msg => {
                const div = document.createElement("div");
                div.className = "msg";
                div.innerHTML = `<span class="msg-author">[${msg.author_codename}]</span> ${msg.message}`;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        window.sendMessage = async function() {
            const input = document.getElementById("msg-input");
            const text = input.value.trim();
            if (!text) return;
            
            input.value = "";
            await supabaseClient.from('rank_chats').insert([{ room_tier: ROOM_TIER, author_codename: myCodename, message: text }]);
            loadMessages();
        }
    </script>
</body>
</html>
