<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel | The Obsidian Circle</title>
    <style>
        body { background-color: #000; color: #fff; font-family: monospace; margin: 0; padding: 20px; }
        .admin-container { max-width: 600px; margin: 0 auto; background-color: #121215; padding: 20px; border-radius: 8px; border: 1px solid #ff4d4d; }
        .header-title { text-align: center; margin-bottom: 20px; font-size: 16px; letter-spacing: 2px; color: #ff4d4d; font-weight: bold; }
        .section { background-color: #070709; border: 1px solid #333; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        .section-title { color: #888; font-size: 12px; margin-bottom: 10px; letter-spacing: 1px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        input[type="text"] { width: 100%; box-sizing: border-box; padding: 12px; background-color: #000; border: 1px solid #555; color: #fff; border-radius: 4px; font-family: monospace; }
        button { background-color: #ff4d4d; color: #000; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; letter-spacing: 1px; width: 100%; margin-bottom: 10px; }
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; }
        .user-name { font-size: 14px; color: #fff; }
        .user-controls { display: flex; gap: 10px; }
        select { background: #000; color: #fff; border: 1px solid #555; padding: 5px; font-family: monospace; border-radius: 3px; }
        .set-btn { padding: 5px 15px; width: auto; margin: 0; background-color: #333; color: #fff; }
        .back-btn { background-color: #222; color: #fff; margin-top: 15px; border: none; width: 100%; padding: 12px; border-radius: 4px; font-size: 12px; letter-spacing: 1px; cursor: pointer; }
    </style>
    <script>
        // Hide the page immediately upon loading to prevent unauthorized flashing
        document.documentElement.style.display = 'none';
    </script>
</head>
<body>
    <div class="admin-container" id="admin-ui" style="display: none;">
        <div class="header-title">◎ ADMIN PANEL ◎</div>
        
        <div class="section">
            <div class="section-title">DEPLOY NEW PROJECT</div>
            <div class="input-group">
                <input type="text" id="input-proj-name" placeholder="PROJECT NAME" autocomplete="off">
                <input type="text" id="input-proj-desc" placeholder="PROJECT DESCRIPTION" autocomplete="off">
            </div>
            <button id="btn-deploy-proj">DEPLOY</button>
        </div>

        <div class="section">
            <div class="section-title">PERSONNEL ROSTER</div>
            <div id="roster-list">
                <div style="color: #666; text-align: center; font-size: 12px;">LOADING SECURE ROSTER...</div>
            </div>
        </div>

        <button class="back-btn" onclick="window.location.href='dashboard.html'">RETURN TO DASHBOARD</button>
    </div>

    <!-- Supabase Secure Admin Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://ahridkmlgjsmlqkqatrz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFocmlka21sZ2pzbWxxa3FhdHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjYwODUsImV4cCI6MjEwNTY0MjA4NX0.r_vPhWLs-hKg7xk6lyge8ITkPP30y53442jrGqNwhWQ'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        document.addEventListener("DOMContentLoaded", async () => {
            // 1. Verify Login & Admin Clearance
            const { data: { user }, error } = await supabaseClient.auth.getUser();
            
            if (error || !user) {
                window.location.replace("index.html");
                return;
            }

            const emailPrefix = user.email.split('@')[0].toUpperCase();
            const rank = emailPrefix.split('-')[0];

            // 2. Reject anyone who isn't FOUNDER or COUNCIL
            if (rank !== 'FOUNDER' && rank !== 'COUNCIL') {
                window.location.replace("dashboard.html");
                return;
            }

            // 3. Authorization successful: Restore Screen Visibility
            document.documentElement.style.display = 'block';
            
            const adminUI = document.getElementById("admin-ui");
            if (adminUI) adminUI.style.display = 'block';

            // 4. Handle Projects logic
            const deployBtn = document.getElementById("btn-deploy-proj");
            if (deployBtn) {
                deployBtn.addEventListener("click", async () => {
                    const pName = document.getElementById("input-proj-name").value.trim().toUpperCase();
                    const pDesc = document.getElementById("input-proj-desc").value.trim();

                    if (!pName || !pDesc) { alert("Please provide both a Name and Description."); return; }

                    const { error: insertError } = await supabaseClient.from('projects').insert([{ title: pName, description: pDesc }]);
                    if (insertError) { alert("ERROR: Database rejected the deployment."); } 
                    else {
                        alert("PROJECT DEPLOYED SECURELY.");
                        document.getElementById("input-proj-name").value = "";
                        document.getElementById("input-proj-desc").value = "";
                    }
                });
            }

            // 5. Initialize Database Roster
            loadRoster();
        });

        async function loadRoster() {
            const rosterContainer = document.getElementById("roster-list");
            if (!rosterContainer) return;

            const { data: users, error } = await supabaseClient.from('profiles').select('id, codename, rank').order('created_at');
            if (error) { rosterContainer.innerHTML = "<div style='color:red; text-align:center;'>Error loading roster.</div>"; return; }

            rosterContainer.innerHTML = "";
            users.forEach(user => {
                const userRow = document.createElement("div");
                userRow.className = "user-row";
                userRow.innerHTML = `
                    <div class="user-name">${user.codename}</div>
                    <div class="user-controls">
                        <select id="rank-${user.id}" class="rank-select">
                            <option value="MEMBER" ${user.rank === 'MEMBER' ? 'selected' : ''}>MEMBER</option>
                            <option value="SPECIALIST" ${user.rank === 'SPECIALIST' ? 'selected' : ''}>SPECIALIST</option>
                            <option value="COUNCIL" ${user.rank === 'COUNCIL' ? 'selected' : ''}>COUNCIL</option>
                            <option value="FOUNDER" ${user.rank === 'FOUNDER' ? 'selected' : ''}>FOUNDER</option>
                        </select>
                        <button class="set-btn" onclick="updateRank('${user.id}')">SET</button>
                    </div>
                `;
                rosterContainer.appendChild(userRow);
            });
        }

        window.updateRank = async function(userId) {
            const newRank = document.getElementById('rank-' + userId).value;
            const { error } = await supabaseClient.from('profiles').update({ rank: newRank }).eq('id', userId);
            if (error) alert("OVERRIDE FAILED: System rejected clearance update.");
            else { alert("CLEARANCE UPDATED."); loadRoster(); }
        };
    </script>
</body>
</html>
