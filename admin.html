<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel | The Obsidian Circle</title>
    <style>
        body { background-color: #000; color: #fff; font-family: monospace; margin: 0; padding: 20px; }
        .admin-container {
            width: 100%; max-width: 600px; margin: 0 auto;
            background-color: #121215; padding: 30px 20px;
            border-radius: 8px; border: 1px solid #ff5555;
        }
        .header-title { text-align: center; margin-bottom: 20px; font-size: 18px; letter-spacing: 3px; color: #ff5555; font-weight: bold; }
        
        .create-box { background-color: #070709; border: 1px solid #333; padding: 15px; border-radius: 4px; margin-bottom: 25px; }
        .create-title { font-size: 12px; color: #ff5555; letter-spacing: 2px; margin-bottom: 15px; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 10px;}
        
        input[type="text"], textarea {
            width: 100%; padding: 12px; margin-bottom: 10px; background-color: #121215; 
            border: 1px solid #444; color: #fff; border-radius: 4px; font-family: monospace; box-sizing: border-box;
        }
        textarea { resize: vertical; min-height: 80px; }
        .action-btn { background-color: #ff5555; color: #fff; border: none; width: 100%; padding: 12px; border-radius: 4px; font-size: 14px; font-weight: bold; letter-spacing: 1px; cursor: pointer; }
        
        .user-row { display: flex; justify-content: space-between; align-items: center; background-color: #121215; padding: 10px; margin-bottom: 8px; border: 1px solid #333; border-radius: 4px; }
        .user-name { font-weight: bold; font-size: 14px; color: #fff; }
        .user-controls { display: flex; gap: 5px; }
        .rank-select { background: #000; color: #fff; border: 1px solid #555; padding: 5px; border-radius: 3px; font-size: 11px; font-family: monospace; }
        .set-btn { background: #ff5555; color: #fff; border: none; padding: 5px 10px; border-radius: 3px; font-weight: bold; cursor: pointer; font-size: 11px; }

        .back-btn { background-color: #333; color: #fff; margin-top: 20px; border: none; width: 100%; padding: 14px; border-radius: 4px; font-size: 14px; font-weight: bold; letter-spacing: 2px; cursor: pointer; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="admin-container" id="main-box" style="display: none;">
        <div class="header-title">◎ FOUNDER COMMAND ◎</div>
        
        <!-- Announcements Panel -->
        <div class="create-box">
            <div class="create-title">+ OVERRIDE: BROADCAST ANNOUNCEMENT</div>
            <input type="text" id="input-ann-title" placeholder="TRANSMISSION TITLE" autocomplete="off">
            <textarea id="input-ann-body" placeholder="ENTER MESSAGE PAYLOAD..."></textarea>
            <button class="action-btn" id="btn-deploy-ann">AUTHORIZE BROADCAST</button>
        </div>

        <!-- Project Deployment Panel -->
        <div class="create-box">
            <div class="create-title">+ OVERRIDE: DEPLOY PROJECT</div>
            <input type="text" id="input-proj-name" placeholder="PROJECT NAME (e.g. PROJECT OMEGA)" autocomplete="off">
            <input type="text" id="input-proj-desc" placeholder="OBJECTIVE / DESCRIPTION" autocomplete="off">
            <button class="action-btn" id="btn-deploy-proj">INITIATE DEPLOYMENT</button>
        </div>

        <!-- Personnel Override Panel -->
        <div class="create-box">
            <div class="create-title">◎ PERSONNEL CLEARANCE OVERRIDE</div>
            <div id="roster-list"><div style="color: #888; font-size: 12px; text-align: center;">DECRYPTING ROSTER...</div></div>
        </div>

        <button class="back-btn" onclick="window.location.href='dashboard.html'">RETURN TO DASHBOARD</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://ahridkmlgjsmlqkqatrz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFocmlka21sZ2pzbWxxa3FhdHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjYwODUsImV4cCI6MjEwNTY0MjA4NX0.r_vPhWLs-hKg7xk6lyge8ITkPP30y53442jrGqNwhWQ';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let myCodename = "COMMAND";

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.replace("index.html"); return; }

            const { data: profile } = await supabaseClient.from('profiles').select('rank, codename').eq('id', session.user.id).single();
            
            if (!profile || (profile.rank !== 'FOUNDER' && profile.rank !== 'COUNCIL')) {
                document.body.innerHTML = `<h2 style="color:red; text-align:center; margin-top:50px;">SECURITY ALERT: CLEARANCE DENIED</h2>`;
                setTimeout(() => window.location.replace("dashboard.html"), 2000);
                return;
            }

            myCodename = profile.codename;
            document.getElementById("main-box").style.display = "block";
            loadRoster();

            // Handle Announcements
            document.getElementById("btn-deploy-ann").addEventListener("click", async () => {
                const aTitle = document.getElementById("input-ann-title").value.trim().toUpperCase();
                const aBody = document.getElementById("input-ann-body").value.trim();

                if (!aTitle || !aBody) { alert("Please provide both Title and Message."); return; }

                const { error } = await supabaseClient.from('announcements').insert([{ title: aTitle, content: aBody, author_codename: myCodename }]);
                if (error) { alert("ERROR: Database rejected the broadcast."); } 
                else {
                    alert("BROADCAST SUCCESSFUL.");
                    document.getElementById("input-ann-title").value = "";
                    document.getElementById("input-ann-body").value = "";
                }
            });

            // Handle Projects
            document.getElementById("btn-deploy-proj").addEventListener("click", async () => {
                const pName = document.getElementById("input-proj-name").value.trim().toUpperCase();
                const pDesc = document.getElementById("input-proj-desc").value.trim();

                if (!pName || !pDesc) { alert("Please provide both a Name and Description."); return; }

                const { error } = await supabaseClient.from('projects').insert([{ title: pName, description: pDesc }]);
                if (error) { alert("ERROR: Database rejected the deployment."); } 
                else {
                    alert("PROJECT DEPLOYED SECURELY.");
                    document.getElementById("input-proj-name").value = "";
                    document.getElementById("input-proj-desc").value = "";
                }
            });
        });

        async function loadRoster() {
            const { data: users, error } = await supabaseClient.from('profiles').select('id, codename, rank').order('created_at');
            const rosterContainer = document.getElementById("roster-list");
            if (error) { rosterContainer.innerHTML = "<div style='color:red; text-align:center;'>Error loading roster.</div>"; return; }

            rosterContainer.innerHTML = "";
            users.forEach(user => {
                const userRow = document.createElement("div");
                userRow.className = "user-row";
                userRow.innerHTML = `
                    <div class="user-name">${user.codename}</div>
                    <div class="user-controls">
                        <select id="rank-${user.id}" class="rank-select">
                            <option value="MEMBER" ${user.rank === 'MEMBER' ? 'selected' : ''}>MEMBER</option>
                            <option value="SPECIALIST" ${user.rank === 'SPECIALIST' ? 'selected' : ''}>SPECIALIST</option>
                            <option value="COUNCIL" ${user.rank === 'COUNCIL' ? 'selected' : ''}>COUNCIL</option>
                            <option value="FOUNDER" ${user.rank === 'FOUNDER' ? 'selected' : ''}>FOUNDER</option>
                        </select>
                        <button class="set-btn" onclick="updateRank('${user.id}')">SET</button>
                    </div>
                `;
                rosterContainer.appendChild(userRow);
            });
        }

        window.updateRank = async function(userId) {
            const newRank = document.getElementById('rank-' + userId).value;
            const { error } = await supabaseClient.from('profiles').update({ rank: newRank }).eq('id', userId);
            if (error) alert("OVERRIDE FAILED: System rejected clearance update.");
            else { alert("CLEARANCE UPDATED."); loadRoster(); }
        };
    </script>
</body>
</html>
